# This docker-compose exists solely for the CI release step (lucos/release-docker
# orb uses Docker Bake and requires a service with a build: block).
# lucos_auth_scopes is a config artefact — it is never deployed as a running service.
services:
  lucos_auth_scopes:
    build: .
    container_name: lucos_auth_scopes
    image: lucas42/lucos_auth_scopes:${VERSION:-latest}
