# lucOS authorisation scope vocabulary
# Flat list of valid scope strings. The file IS the allowlist: a scope is valid
# iff it appears here. The ":" prefix (where present) groups by resource/capability
# DOMAIN for collision-avoidance — it is NOT an owning service and NOT a structural
# level. Estate-wide capabilities sit bare.
#
# This vocabulary is build-time coupled: changing it requires a rebuild and
# redeploy of lucos_aithne and lucos_creds to take effect.
# (See lucos_aithne ADR-0001 §7 for design rationale.)
#
# Default-deny: add a scope only when a real consumer needs it.

scopes:
  - render-ui    # dev-only: GET-render any service's UI (e.g. lucos-ux page snapshots)
  - aithne:admin # full admin surface: scope-grant authority + account enrolment/recovery (gates lucos_aithne#9)

  # arachne scopes
  - arachne:read   # read the arachne knowledge graph (gates /explore UI and /mcp API)

  # eolas scopes (lucos_eolas) — the eolas UI reuses these: a scope gates a capability, not an interface
  - eolas:read   # read eolas metadata entities (GET /metadata/* and the eolas UI views)
  - eolas:write  # create/modify eolas metadata entities (POST /metadata/{type}/ and UI edits)

  # media-metadata scopes (lucos_media_metadata_api) — the lucos_media_metadata_manager front-end reuses these
  - media-metadata:read  # read media metadata (GET /v3/*, GET /v2/export, and the manager UI)
  - media-metadata:write # mutate media metadata (POST/PATCH/DELETE /v3/* and manager UI edits)

  # backups scopes (lucos_backups)
  - backups:read   # view the backup summary & per-host status dashboards (GET /, /hosts/*)
  - backups:write  # trigger operational refresh actions (/refresh-tracking, /refresh-config)

  # contacts scopes (lucos_contacts)
  - contacts:read   # view people, lists & calendar (GET /people/*, /calendar)
  - contacts:write  # add / import / edit contacts & relationships

  # creds scopes (lucos_creds)
  - creds:admin    # lucos_creds admin UI: manage credentials & linked-credential scopes (privileged console; no meaningful read-only posture)

  # loganne scopes (lucos_loganne) — the machine delivery path holds the bare `webhook` scope below
  - loganne:read   # view the event-log UI (GET /view and the event list)
  - loganne:write  # trigger webhook re-delivery (POST /retry-webhooks, /:uuid/retry-webhooks)

  # media-seinn scopes (lucos_media_seinn)
  - media-seinn:read   # view the player & now-playing state (GET /)
  - media-seinn:write  # control playback (POST /play, /pause, /next, /volume)

  # notes scopes (lucos_notes)
  - notes:read   # read notes & lists (GET /<list>, /<list>/<item>, /todo.json)
  - notes:write  # create / edit / delete notes & lists (PUT/DELETE /api/list/*, /api/item/*)

  # photos scopes (lucos_photos)
  - photos:read   # view photos, people & faces (GET /photos/*, /people/*)
  - photos:write  # manage people, faces & tags — link, merge & edit (POST/PUT/DELETE /people/*, /faces/*)

  # estate-wide bundled scopes
  - webhook      # receive Loganne webhook events (POST /webhooks); held by lucos_loganne
