# lucOS authorisation scope vocabulary
# Flat list of valid scope strings. The file IS the allowlist: a scope is valid
# iff it appears here. The ":" prefix (where present) groups by resource/capability
# DOMAIN for collision-avoidance — it is NOT an owning service and NOT a structural
# level. Estate-wide capabilities sit bare.
#
# This vocabulary is build-time coupled: changing it requires a rebuild and
# redeploy of lucos_aithne and lucos_creds to take effect.
# (See lucos_aithne ADR-0001 §7 for design rationale.)
#
# Default-deny: add a scope only when a real consumer needs it.

scopes:
  - render-ui    # dev-only: GET-render any service's UI (e.g. lucos-ux page snapshots)
  - aithne:admin # full admin surface: scope-grant authority + account enrolment/recovery (gates lucos_aithne#9)

  # arachne scopes
  - arachne:read   # read the arachne knowledge graph (gates /explore UI and /mcp API)

  # eolas scopes
  - eolas:read   # read eolas metadata entities (GET endpoints on /metadata/*)
  - eolas:write  # create/modify eolas metadata entities (POST /metadata/{type}/)
  - eolas:admin  # eolas Django admin (grants is_staff + is_superuser)

  # media-metadata scopes
  - media-metadata:read  # read media metadata (GET /v3/* and GET /v2/export)
  - media-metadata:write # mutate media metadata (POST/PATCH/DELETE /v3/*)

  # backups scopes (lucos_backups)
  - backups:use    # full use of the backups UI: status dashboards + refresh actions

  # contacts scopes (lucos_contacts)
  - contacts:read   # readonly browse layer (GET endpoints on people, lists & calendar)
  - contacts:write  # create/modify contacts (POST /people/import; machine importers use this)
  - contacts:admin  # contacts Django admin (grants is_staff + is_superuser)

  # creds scopes (lucos_creds)
  - creds:admin    # lucos_creds admin UI: manage credentials & linked-credential scopes (privileged console)

  # loganne scopes (lucos_loganne) — the machine delivery path holds the bare `webhook` scope below;
  # adding events to loganne would be a separate scope if/when a consumer needs it
  - loganne:use    # full use of the loganne human UI: view the event log + operator retry actions

  # media-manager scopes (lucos_media_manager; lucos_media_seinn is a UI wrapper and shares this scope)
  - media-manager:use   # full use of the media player UI (manager + seinn)

  # notes scopes (lucos_notes)
  - notes:use   # full use of the notes UI: read & write notes & lists

  # photos scopes (lucos_photos)
  - photos:use  # full use of the photos UI: view & manage photos, people & faces

  # estate-wide bundled scopes
  - webhook      # receive Loganne webhook events (POST /webhooks); held by lucos_loganne
